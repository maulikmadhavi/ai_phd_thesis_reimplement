[workspace]
name = "qbestd"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pysoundfile = "*"
pyarrow = "*"
huggingface_hub = "*"
pytest = "*"

[activation.env]
PYTHONPATH = "src"

[tasks]
test = "pytest -q"
train-gmm = "python -m qbestd.ml.train"
eval-timit = "python -m qbestd.eval.run_timit"

[feature.demo.dependencies]
gradio = "*"
matplotlib = "*"

[feature.demo.tasks]
demo-stage1 = "python demo/stage1_audio_demo.py"
demo-stage2 = "python demo/stage2_features_demo.py"
demo-stage3 = "python demo/stage3_gmm_demo.py"
demo-stage5 = "python demo/stage5_search_demo.py"

# Forced alignment of TIMIT words (GPU model). Torch stays out of core/demo.
[feature.align.system-requirements]
cuda = "12"

[feature.align.dependencies]
pytorch-gpu = "*"
transformers = "*"
safetensors = "*"

[feature.align.tasks]
align-timit = "python -m qbestd.alignment.run --split all --device cuda"

[environments]
demo = ["demo"]
align = ["align"]
