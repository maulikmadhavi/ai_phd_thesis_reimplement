[workspace]
name = "qbestd"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pysoundfile = "*"
pytest = "*"

[activation.env]
PYTHONPATH = "src"

[tasks]
test = "pytest -q"

[feature.demo.dependencies]
gradio = "*"
matplotlib = "*"

[feature.demo.tasks]
demo-stage1 = "python demo/stage1_audio_demo.py"
demo-stage2 = "python demo/stage2_features_demo.py"

[environments]
demo = ["demo"]
